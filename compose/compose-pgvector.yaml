# Overlay: merged only when `make local-up-pgvector`.
# Runs a pgvector Postgres so the notebooks vector store mirrors the cluster
# (which uses pgvector) instead of the default local FAISS store. Pair with
# LIGHTSPEED_STACK_CONFIG=generated/lightspeed-stack.pgvector.yaml.
services:
  pgvector:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg15}
    environment:
      - POSTGRES_USER=${PGVECTOR_USER:-postgres}
      - POSTGRES_PASSWORD=${PGVECTOR_PASSWORD:-postgres}
      - POSTGRES_DB=${PGVECTOR_DB:-notebooks}
    volumes:
      - ./pgvector-init.sql:/docker-entrypoint-initdb.d/pgvector-init.sql:Z,ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PGVECTOR_USER:-postgres} -d ${PGVECTOR_DB:-notebooks}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  lightspeed-core:
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      - PGVECTOR_HOST=pgvector
      - PGVECTOR_DB=${PGVECTOR_DB:-notebooks}
      - PGVECTOR_USER=${PGVECTOR_USER:-postgres}
      - PGVECTOR_PASSWORD=${PGVECTOR_PASSWORD:-postgres}
